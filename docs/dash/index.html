<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WX Center Dashboard</title>
<meta name="theme-color" content="#0B0F14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WX Dashboard">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="icon" href="../icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&display=swap">
<script src="config.js"></script>
<style>
/* The web version of the dashboard: a header (base, Aircraft / Weather) over the chosen page, which is the TV page
   itself (wb.html or weather.html) with its phone layout. Data comes through the relay (config.js). */
:root { --bg: #0B0F14; --panel: #121820; --line: #1E2836; --line-strong: #2A3646; --fg: #E8EEF5; --muted: #93A1B3; --accent: #7CC4FF; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.3 'Barlow Semi Condensed', 'Segoe UI', system-ui, sans-serif; }
body { display: flex; flex-direction: column; height: 100dvh; }
header { flex: 0 0 auto; display: flex; align-items: center; gap: 10px; padding: calc(8px + env(safe-area-inset-top)) 12px 8px; border-bottom: 1px solid var(--line); background: var(--panel); }
header h1 { margin: 0; font-size: 18px; font-weight: 600; white-space: nowrap; }
header .sp { flex: 1 1 auto; }
select { height: 34px; padding: 0 8px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--bg); color: var(--fg); font: 600 16px inherit; font-family: inherit; }
.seg { display: inline-flex; padding: 2px; border-radius: 9px; border: 1px solid var(--line-strong); background: var(--bg); }
.seg button { height: 30px; padding: 0 12px; border: 0; border-radius: 7px; background: none; color: var(--muted); font: 600 15px inherit; font-family: inherit; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--bg); }
iframe { flex: 1 1 auto; width: 100%; border: 0; background: var(--bg); }
.gear { width: 36px; height: 34px; padding: 0; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--bg); color: var(--fg); font-size: 20px; line-height: 1; cursor: pointer; }
/* The settings window (settings.html, as on the TVs) over the page */
#settings { position: fixed; inset: 0; z-index: 10; width: 100%; height: 100dvh; background: var(--bg); }
#settings[hidden] { display: none; }
.note { margin: auto; max-width: 520px; padding: 24px; text-align: center; color: var(--muted); font-size: 18px; }
.note b { display: block; color: var(--fg); font-size: 22px; margin-bottom: 8px; }
@media (max-width: 380px) { header h1 { display: none; } }
</style>
</head>
<body>
<header>
  <h1>WX Center</h1><span class="sp"></span>
  <select id="base" aria-label="Base"></select>
  <span class="seg" role="group" aria-label="Page"><button type="button" data-v="wb">Aircraft</button><button type="button" data-v="weather">Weather</button></span>
  <button type="button" class="gear" id="gear" aria-label="Settings" title="Settings">⚙</button>
</header>
<iframe id="page" title="Dashboard page"></iframe>
<iframe id="settings" title="Settings" hidden></iframe>
<script src="sheet.js"></script>
<script src="web-core.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var q = new URLSearchParams(location.search);
  function get(k, d) { try { return localStorage.getItem('wxc-web-' + k) || d; } catch (e) { return d; } }
  function put(k, v) { try { localStorage.setItem('wxc-web-' + k, v); } catch (e) {} }
  // A link can pick the base and page (?base=SGU&view=weather); otherwise the last ones used on this phone. The base
  // is this phone's Base setting (the same one the settings window shows).
  var view = q.get('view') || get('view', 'wb');
  if (q.get('base')) WXCWeb.setBase(q.get('base'));
  else if (get('base', '') && (function () { try { return !localStorage.getItem('wxc-web-settings'); } catch (e) { return false; } })()) WXCWeb.setBase(get('base', '')); // picked before there were settings
  if (!window.WXC_WEB || !WXC_WEB.relay) {
    $('page').outerHTML = '<div class="note"><b>Not set up yet</b>The web dashboard needs its data relay. Once it’s set up, this page shows the weight and balance and the weather for each base.</div>';
    return;
  }
  // The pages are built from this phone's settings (local, plus the base's central settings), like a TV's
  function show() {
    Array.prototype.forEach.call(document.querySelectorAll('.seg button'), function (b) { b.setAttribute('aria-pressed', String(b.dataset.v === view)); });
    $('page').src = WXCWeb.pageUrl(view);
    $('base').value = WXCWeb.base();
    put('view', view);
  }
  document.querySelector('.seg').addEventListener('click', function (e) { var b = e.target.closest('button'); if (b && b.dataset.v !== view) { view = b.dataset.v; show(); } });
  $('base').addEventListener('change', function () { WXCWeb.setBase(this.value); show(); });
  // Settings: the TVs' settings window, kept on this phone; Save or Close comes back here
  $('gear').addEventListener('click', function () { $('settings').src = 'settings.html' + (WXCWeb.light() ? '?theme=light' : ''); $('settings').hidden = false; });
  addEventListener('message', function (e) {
    if (e.origin !== location.origin || !e.data || !e.data.wxc) return;
    $('settings').hidden = true; $('settings').src = 'about:blank';
    if (e.data.wxc === 'saved') { drawBases(); show(); }
  });
  var tabs = [];
  function drawBases() {
    var names = tabs.map(function (t) { return t.name.replace(/[^A-Za-z0-9]/g, '').toUpperCase(); }), b = WXCWeb.base();
    if (names.indexOf(b) < 0) names.push(b);
    $('base').innerHTML = names.map(function (n) { return '<option value="' + n + '"' + (n === b ? ' selected' : '') + '>' + n + '</option>'; }).join('');
  }
  Promise.all([WXSheet.tabs(), WXCWeb.ready()]).then(function (r) { tabs = r[0]; drawBases(); show(); });
  // Appearance Auto follows the phone's light / dark mode, also when the phone switches while this is open
  if (window.matchMedia) {
    var mq = matchMedia('(prefers-color-scheme: light)'), onMode = function () { if (WXCWeb.effective().theme === 'auto' && $('settings').hidden) show(); };
    if (mq.addEventListener) mq.addEventListener('change', onMode); else if (mq.addListener) mq.addListener(onMode);
  }
  // Central settings published while this is open: picked up when the phone comes back to it
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible' && Date.now() - (window.__shown || 0) > 600000) location.reload(); });
  window.__shown = Date.now();
  if ('serviceWorker' in navigator && !/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) navigator.serviceWorker.register('sw.js').catch(function () {});
})();
</script>
</body>
</html>
