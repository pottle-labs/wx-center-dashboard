<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WX Center Dashboard</title>
<meta name="theme-color" content="#0B0F14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WX Dashboard">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="icon" href="../icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&display=swap">
<script src="config.js"></script>
<style>
/* The web version of the dashboard: a header (base, Aircraft / Weather) over the chosen page, which is the TV page
   itself (wb.html or weather.html) with its phone layout. Data comes through the relay (config.js). */
:root { --bg: #0B0F14; --panel: #121820; --line: #1E2836; --line-strong: #2A3646; --fg: #E8EEF5; --muted: #93A1B3; --accent: #7CC4FF; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.3 'Barlow Semi Condensed', 'Segoe UI', system-ui, sans-serif; }
body { display: flex; flex-direction: column; height: 100dvh; }
header { flex: 0 0 auto; display: flex; align-items: center; gap: 10px; padding: calc(8px + env(safe-area-inset-top)) 12px 8px; border-bottom: 1px solid var(--line); background: var(--panel); }
header h1 { margin: 0; font-size: 18px; font-weight: 600; white-space: nowrap; }
header .sp { flex: 1 1 auto; }
select { height: 34px; padding: 0 8px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--bg); color: var(--fg); font: 600 16px inherit; font-family: inherit; }
.seg { display: inline-flex; padding: 2px; border-radius: 9px; border: 1px solid var(--line-strong); background: var(--bg); }
.seg button { height: 30px; padding: 0 12px; border: 0; border-radius: 7px; background: none; color: var(--muted); font: 600 15px inherit; font-family: inherit; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--bg); }
iframe { flex: 1 1 auto; width: 100%; border: 0; background: var(--bg); }
.note { margin: auto; max-width: 520px; padding: 24px; text-align: center; color: var(--muted); font-size: 18px; }
.note b { display: block; color: var(--fg); font-size: 22px; margin-bottom: 8px; }
@media (max-width: 380px) { header h1 { display: none; } }
</style>
</head>
<body>
<header>
  <h1>WX Center</h1><span class="sp"></span>
  <select id="base" aria-label="Base"></select>
  <span class="seg" role="group" aria-label="Page"><button type="button" data-v="wb">Aircraft</button><button type="button" data-v="weather">Weather</button></span>
</header>
<iframe id="page" title="Dashboard page"></iframe>
<script src="sheet.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var q = new URLSearchParams(location.search);
  function get(k, d) { try { return localStorage.getItem('wxc-web-' + k) || d; } catch (e) { return d; } }
  function put(k, v) { try { localStorage.setItem('wxc-web-' + k, v); } catch (e) {} }
  // A link can pick the base and page (?base=SGU&view=weather); otherwise the last ones used on this phone
  var base = (q.get('base') || get('base', 'SGU')).toUpperCase(), view = q.get('view') || get('view', 'wb');
  if (!window.WXC_WEB || !WXC_WEB.relay) {
    $('page').outerHTML = '<div class="note"><b>Not set up yet</b>The web dashboard needs its data relay. Once it’s set up, this page shows the weight and balance and the weather for each base.</div>';
    return;
  }
  // What the web version shows: the TV pages with their usual features off, plus TFRs, faded old reports, runway
  // winds and the sun times, which are the most useful away from the TVs
  function src() {
    if (view === 'weather') return 'weather.html?station=K' + encodeURIComponent(base) + '&radius=100&loop=1&tfrs=1&oldObs=1&runway=table&sun=strip';
    return 'wb.html?tab=' + encodeURIComponent(base) + '&refresh=5';
  }
  function show() {
    Array.prototype.forEach.call(document.querySelectorAll('.seg button'), function (b) { b.setAttribute('aria-pressed', String(b.dataset.v === view)); });
    $('page').src = src();
    put('base', base); put('view', view);
  }
  document.querySelector('.seg').addEventListener('click', function (e) { var b = e.target.closest('button'); if (b && b.dataset.v !== view) { view = b.dataset.v; show(); } });
  $('base').addEventListener('change', function () { base = this.value; show(); });
  WXSheet.tabs().then(function (tabs) {
    var names = tabs.map(function (t) { return t.name.replace(/[^A-Za-z0-9]/g, '').toUpperCase(); });
    if (names.indexOf(base) < 0) names.push(base);
    $('base').innerHTML = names.map(function (n) { return '<option value="' + n + '"' + (n === base ? ' selected' : '') + '>' + n + '</option>'; }).join('');
  });
  show();
  if ('serviceWorker' in navigator && !/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) navigator.serviceWorker.register('sw.js').catch(function () {});
})();
</script>
</body>
</html>
